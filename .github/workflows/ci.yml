name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: .NET backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/ServisOptimizasyon.sln
      - name: Build
        run: dotnet build backend/ServisOptimizasyon.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/ServisOptimizasyon.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: React arayüz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/servis-optimizasyon-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/servis-optimizasyon-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  optimization:
    name: Optimizasyon servisi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy app
      - name: Test
        # Gerçek OSRM/VROOM gerektiren testler ortam değişkeni olmadan atlanır.
        run: python -m pytest -q

  contract:
    name: OpenAPI sözleşmesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install pyyaml
      - name: Validate
        run: python -c "import yaml,sys; yaml.safe_load(open('contracts/openapi.yaml', encoding='utf-8')); print('openapi.yaml gecerli')"
