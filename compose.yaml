name: personel-servis-optimizasyon

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Eski PoC şemasını taşıyan volume ile çakışmaması için sürümlü uygulama volume'u.
      - postgres-app-data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/ServisOptimizasyon.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Services__OptimizationUrl: ${OPTIMIZATION_URL}
      Services__VroomUrl: ${VROOM_URL}
      Geocoding__BaseUrl: ${GEOCODING_URL:-http://nominatim:8080}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:5173}
      RestrictedAreas__FilePath: /config/restricted-areas.geojson
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin@servis.com}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123456!}
      BootstrapAdmin__DisplayName: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Sistem Yöneticisi}
    volumes:
      - ./infrastructure/restricted-areas.geojson:/config/restricted-areas.geojson:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      nominatim:
        condition: service_healthy
      optimization:
        condition: service_healthy

  # Türkiye extract'ini indirir ve Ankara kapsamına keser. Nominatim ham PBF'i,
  # OSRM ise halka kapalı alanları maskelenmiş ankara-routing.osm.pbf'i kullanır.
  # Volume doluyken işlem tekrarlanmaz.
  map-prepare:
    build:
      context: ./infrastructure/nominatim
    environment:
      TURKEY_PBF_URL: https://download.geofabrik.de/europe/turkey-latest.osm.pbf
      # Ankara ilini kapsayan yaklaşık WGS84 bbox: minLon,minLat,maxLon,maxLat.
      ANKARA_BBOX: 30.80,38.60,34.20,40.90
    volumes:
      - map-source:/map
      - ./infrastructure/restricted-areas.geojson:/config/restricted-areas.geojson:ro
    restart: "no"

  # İlk çalıştırmada hazırlanmış Ankara PBF'sini otomatik içe aktarır.
  # İndeks kalıcı volume'da tutulduğu için sonraki açılışlarda yeniden import edilmez.
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PBF_PATH: /nominatim/import/ankara.osm.pbf
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: 4
      NOMINATIM_PASSWORD: local_nominatim_only
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
    volumes:
      - nominatim-ankara-data:/var/lib/postgresql/16/main
      # Nominatim başlangıç script'i /nominatim altındaki dosyaların sahipliğini
      # ayarladığı için bu volume salt-okunur bağlanamaz.
      - map-source:/nominatim/import
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 10m
    depends_on:
      map-prepare:
        condition: service_completed_successfully

  optimization:
    build:
      context: ./optimization
    restart: unless-stopped
    environment:
      OSRM_FOOT_URL: ${OSRM_FOOT_URL}
      NOMINATIM_URL: ${GEOCODING_URL:-http://nominatim:8080}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # osrm-foot yalnızca `routing` profilinde çalıştığı için burada depends_on
    # verilmez; profiller arası bağımlılık profilsiz `up` çağrısını bozuyordu.
    # Profil kapalıyken servis ayakta kalır ve durak üretim isteklerine OSRM'e
    # ulaşamadığını belirten 503 döner.

  frontend:
    build:
      context: ./frontend/servis-optimizasyon-ui
      args:
        # Vite bu değişkeni derleme anında bundle'a gömer. Runtime `environment`
        # olarak verilirse tarayıcıdaki değer `undefined` kalır ve arayüz
        # backend'e hiç bağlanamaz.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        # Manuel planlama döneminde varsayılan kapalıdır; açılması için açıkça true verilmelidir.
        VITE_ENABLE_FULL_OPTIMIZATION: ${VITE_ENABLE_FULL_OPTIMIZATION:-false}
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

  # Nominatim ile paylaşılan Ankara PBF'sinden car ve foot MLD verilerini üretir.
  # Tamamlanmış çıktılar named volume'da kalır ve sonraki açılışlarda kullanılır.
  osrm-prepare:
    image: personel-servis-optimizasyon-osrm:local
    build:
      context: ./infrastructure/osrm
    profiles: ["routing"]
    restart: "no"
    command: /usr/local/bin/prepare-osrm
    volumes:
      - map-source:/map:ro
      - osrm-data:/data
    depends_on:
      map-prepare:
        condition: service_completed_successfully

  # --max-table-size varsayılanı 100'dür. Optimizasyon servisi personel ve durak
  # adayı koordinatlarını tek /table isteğinde gönderdiği için varsayılan değer
  # 51 personelde "TooBig" hatası verir.
  #
  osrm-car:
    image: personel-servis-optimizasyon-osrm:local
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/car.osrm
    volumes:
      - osrm-data:/data:ro
    ports:
      - "5002:5000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully

  osrm-foot:
    image: personel-servis-optimizasyon-osrm:local
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/foot.osrm
    volumes:
      - osrm-data:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully

  vroom:
    image: vroomvrp/vroom-docker@sha256:2e417553320bf68a25f6614ba8bdc31b0b2fc1172f8c25518c4656f488031c2a
    profiles: ["routing"]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./infrastructure/vroom/config.yml:/conf/config.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      osrm-car:
        condition: service_healthy

volumes:
  postgres-app-data:
  nominatim-ankara-data:
  map-source:
  osrm-data:
