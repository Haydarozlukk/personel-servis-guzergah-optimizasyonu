name: personel-servis-optimizasyon

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Eski PoC şemasını taşıyan volume ile çakışmaması için sürümlü uygulama volume'u.
      - postgres-app-data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/ServisOptimizasyon.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Services__OptimizationUrl: ${OPTIMIZATION_URL}
      Services__VroomUrl: ${VROOM_URL}
      Geocoding__BaseUrl: ${GEOCODING_URL:-http://nominatim:8080}
      Geocoding__PublicBaseUrl: https://nominatim.openstreetmap.org
      Geocoding__PublicViewbox: 32.60,40.05,33.05,39.75
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      nominatim:
        condition: service_healthy
      optimization:
        condition: service_healthy

  # Türkiye extract'ini indirir ve Nominatim'e verilmeden önce Ankara kapsamına
  # keser. Çıktı volume'da kaldığı için sonraki açılışlarda işlem tekrarlanmaz.
  nominatim-prepare:
    build:
      context: ./infrastructure/nominatim
    environment:
      TURKEY_PBF_URL: https://download.geofabrik.de/europe/turkey-latest.osm.pbf
      # Ankara ilini kapsayan yaklaşık WGS84 bbox: minLon,minLat,maxLon,maxLat.
      ANKARA_BBOX: 30.80,38.60,34.20,40.90
    volumes:
      - nominatim-import:/import
    restart: "no"

  # İlk çalıştırmada hazırlanmış Ankara PBF'sini otomatik içe aktarır.
  # İndeks kalıcı volume'da tutulduğu için sonraki açılışlarda yeniden import edilmez.
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PBF_PATH: /nominatim/import/ankara.osm.pbf
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: 4
      NOMINATIM_PASSWORD: local_nominatim_only
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
    volumes:
      - nominatim-ankara-data:/var/lib/postgresql/16/main
      # Nominatim başlangıç script'i /nominatim altındaki dosyaların sahipliğini
      # ayarladığı için bu volume salt-okunur bağlanamaz.
      - nominatim-import:/nominatim/import
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 10m
    depends_on:
      nominatim-prepare:
        condition: service_completed_successfully

  optimization:
    build:
      context: ./optimization
    restart: unless-stopped
    environment:
      OSRM_FOOT_URL: ${OSRM_FOOT_URL}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # osrm-foot yalnızca `routing` profilinde çalıştığı için burada depends_on
    # verilmez; profiller arası bağımlılık profilsiz `up` çağrısını bozuyordu.
    # Profil kapalıyken servis ayakta kalır ve durak üretim isteklerine OSRM'e
    # ulaşamadığını belirten 503 döner.

  frontend:
    build:
      context: ./frontend/servis-optimizasyon-ui
      args:
        # Vite bu değişkeni derleme anında bundle'a gömer. Runtime `environment`
        # olarak verilirse tarayıcıdaki değer `undefined` kalır ve arayüz
        # backend'e hiç bağlanamaz.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

  # OSRM verisi image içinde değil, hosttaki infrastructure/osrm/data altında tutulur.
  # Ön işleme tamamlanmadan bu servisler başlatılmaz.
  #
  # --max-table-size varsayılanı 100'dür. Optimizasyon servisi personel ve durak
  # adayı koordinatlarını tek /table isteğinde gönderdiği için varsayılan değer
  # 51 personelde "TooBig" hatası verir.
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/car-new.osrm
    volumes:
      - ./infrastructure/osrm/data:/data:ro
    ports:
      - "5002:5000"

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/foot.osrm
    volumes:
      - ./infrastructure/osrm/data:/data:ro
    ports:
      - "5001:5000"

  vroom:
    image: vroomvrp/vroom-docker@sha256:2e417553320bf68a25f6614ba8bdc31b0b2fc1172f8c25518c4656f488031c2a
    profiles: ["routing"]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./infrastructure/vroom/config.yml:/conf/config.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - osrm-car

volumes:
  postgres-app-data:
  nominatim-ankara-data:
  nominatim-import:
